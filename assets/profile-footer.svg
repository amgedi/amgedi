<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="128" viewBox="0 0 1200 128" role="img" aria-labelledby="title desc">
  <title id="title">AMGED profile footer</title>
  <desc id="desc">A translucent earthy footer with layered green and brown waves.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93AC80" stop-opacity=".1"/>
      <stop offset="45%" stop-color="#6F875F" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#A18463" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F2A1F" stop-opacity=".72"/>
      <stop offset="48%" stop-color="#3F5B3B" stop-opacity=".58"/>
      <stop offset="100%" stop-color="#A18463" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A18463" stop-opacity=".22"/>
      <stop offset="55%" stop-color="#93AC80" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#F4F1E8" stop-opacity=".09"/>
    </linearGradient>
  </defs>

  <rect x="42" y="12" width="1116" height="1" fill="url(#edge)"/>
  <path d="M0 84 C190 42 350 108 566 70 C784 31 963 92 1200 48 L1200 128 L0 128 Z" fill="url(#waveA)"/>
  <path d="M0 102 C225 66 386 116 620 91 C830 68 1001 111 1200 79 L1200 128 L0 128 Z" fill="url(#waveB)"/>

  <g transform="translate(380 31)">
    <rect width="440" height="50" rx="25" fill="#FFFFFF" fill-opacity=".045" stroke="#D8E2D0" stroke-opacity=".14"/>
    <text x="220" y="22" text-anchor="middle" fill="#F4F1E8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">BUILD • TEST • DOCUMENT • IMPROVE</text>
    <text x="220" y="39" text-anchor="middle" fill="#C8D3BD" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1">open source • practical software • learning in public</text>
  </g>
</svg>
