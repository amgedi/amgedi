<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">AMGED</title>
  <desc id="desc">Animated earthy glass banner for Amged's open-source software profile.</desc>

  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111A12"/>
      <stop offset="38%" stop-color="#2C412B"/>
      <stop offset="70%" stop-color="#62543D"/>
      <stop offset="100%" stop-color="#967B5D"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".085"/>
      <stop offset="55%" stop-color="#E8E3D8" stop-opacity=".035"/>
      <stop offset="100%" stop-color="#A18463" stop-opacity=".055"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93AC80" stop-opacity="0"/>
      <stop offset="35%" stop-color="#93AC80" stop-opacity=".9"/>
      <stop offset="65%" stop-color="#D8E2D0" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#A18463" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="greenGlow">
      <stop offset="0%" stop-color="#93AC80" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#93AC80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow">
      <stop offset="0%" stop-color="#D0B18A" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#D0B18A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="outer">
      <rect width="1200" height="260" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#outer)">
    <rect width="1200" height="260" fill="url(#base)"/>

    <ellipse cx="120" cy="230" rx="300" ry="180" fill="url(#greenGlow)" filter="url(#blur)">
      <animate attributeName="cx" values="80;235;80" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;205;230" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1080" cy="15" rx="290" ry="180" fill="url(#warmGlow)" filter="url(#blur)">
      <animate attributeName="cx" values="1110;1015;1110" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0;55;0" dur="10s" repeatCount="indefinite"/>
    </ellipse>

    <path d="M-120 204 C120 151 315 226 535 188 C760 149 955 208 1320 137" fill="none" stroke="#D8E2D0" stroke-opacity=".09" stroke-width="1.2">
      <animateTransform attributeName="transform" type="translate" values="-22 0;30 -4;-22 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M-150 225 C100 183 350 250 605 207 C835 169 1050 227 1330 178" fill="none" stroke="#A18463" stroke-opacity=".13" stroke-width="1.35">
      <animateTransform attributeName="transform" type="translate" values="25 0;-28 5;25 0" dur="16s" repeatCount="indefinite"/>
    </path>
    <path d="M-90 239 C165 205 385 249 630 227 C905 202 1060 236 1290 215" fill="none" stroke="#93AC80" stroke-opacity=".075" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="-15 0;18 -2;-15 0" dur="18s" repeatCount="indefinite"/>
    </path>

    <rect x="27" y="25" width="1146" height="210" rx="26" fill="url(#glass)" stroke="#E8E3D8" stroke-opacity=".15"/>
    <rect x="28" y="26" width="1144" height="1" rx="1" fill="#FFFFFF" fill-opacity=".18"/>

    <g transform="translate(71 70)">
      <circle cx="8" cy="8" r="7" fill="#93AC80" opacity=".95"/>
      <circle cx="8" cy="8" r="15" fill="#93AC80" opacity=".12">
        <animate attributeName="r" values="10;18;10" dur="4.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".18;.035;.18" dur="4.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="72" y="110" fill="#F4F1E8" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" letter-spacing="5">AMGED</text>
    <text x="73" y="150" fill="#E8E3D8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">Building practical open-source software</text>
    <text x="73" y="184" fill="#D8E2D0" font-family="Arial, Helvetica, sans-serif" font-size="19">Wildlife • Conservation • Better Data • Cloud &amp; DevOps</text>

    <g transform="translate(770 57)">
      <rect width="356" height="148" rx="24" fill="#0B120D" fill-opacity=".30" stroke="#E8E3D8" stroke-opacity=".14"/>
      <rect x="1" y="1" width="354" height="1" rx="1" fill="#FFFFFF" fill-opacity=".14"/>

      <text x="24" y="29" fill="#C8D3BD" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">BUILD • TEST • SHIP</text>
      <text x="24" y="48" fill="#F4F1E8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">LEARN • ITERATE • IMPROVE</text>

      <g transform="translate(24 63)">
        <path d="M0 38 C30 10 56 51 88 27 C117 5 144 49 179 18 C207 -4 234 24 269 10" fill="none" stroke="#D8E2D0" stroke-opacity=".20" stroke-width="2"/>
        <path d="M0 38 C30 10 56 51 88 27 C117 5 144 49 179 18 C207 -4 234 24 269 10" fill="none" stroke="url(#lineGlow)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="34 70" stroke-dashoffset="0">
          <animate attributeName="stroke-dashoffset" values="0;-208" dur="5.5s" repeatCount="indefinite"/>
        </path>
        <circle cx="0" cy="38" r="4.5" fill="#93AC80">
          <animate attributeName="r" values="4;6;4" dur="3.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="88" cy="27" r="4.5" fill="#A18463">
          <animate attributeName="opacity" values=".55;1;.55" dur="2.7s" repeatCount="indefinite"/>
        </circle>
        <circle cx="179" cy="18" r="4.5" fill="#D8E2D0">
          <animate attributeName="r" values="4;6.5;4" dur="3.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="269" cy="10" r="4.5" fill="#6F875F">
          <animate attributeName="opacity" values=".45;1;.45" dur="3.1s" repeatCount="indefinite"/>
        </circle>
      </g>

      <text x="24" y="132" fill="#C8D3BD" font-family="Arial, Helvetica, sans-serif" font-size="11.5" letter-spacing=".7">software • data • cloud • open source</text>
    </g>

    <rect x="-430" y="-95" width="250" height="445" fill="url(#shine)" transform="rotate(18 0 0)" opacity=".64">
      <animate attributeName="x" values="-430;1430" dur="10.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
