<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">AMGED</title>
  <desc id="desc">Open-source software, wildlife, conservation, better data, cloud and DevOps.</desc>

  <defs>
    <linearGradient id="glassBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172217" stop-opacity=".92"/>
      <stop offset="42%" stop-color="#30452D" stop-opacity=".82"/>
      <stop offset="74%" stop-color="#65573F" stop-opacity=".78"/>
      <stop offset="100%" stop-color="#9A8061" stop-opacity=".72"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93AC80"/>
      <stop offset="52%" stop-color="#D8E2D0"/>
      <stop offset="100%" stop-color="#A18463"/>
    </linearGradient>

    <radialGradient id="glowGreen">
      <stop offset="0%" stop-color="#93AC80" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#93AC80" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowWarm">
      <stop offset="0%" stop-color="#D0B18A" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#D0B18A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>

    <clipPath id="outer">
      <rect width="1200" height="260" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#outer)">
    <rect width="1200" height="260" fill="url(#glassBase)"/>

    <ellipse cx="180" cy="245" rx="245" ry="145" fill="url(#glowGreen)" filter="url(#blur40)">
      <animate attributeName="cx" values="150;225;150" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1065" cy="25" rx="250" ry="160" fill="url(#glowWarm)" filter="url(#blur40)">
      <animate attributeName="cy" values="18;52;18" dur="10s" repeatCount="indefinite"/>
    </ellipse>

    <path d="M-80 214 C170 152 340 250 570 196 C800 142 980 220 1280 146" fill="none" stroke="#D8E2D0" stroke-opacity=".09" stroke-width="1.5">
      <animateTransform attributeName="transform" type="translate" values="-18 0;22 -3;-18 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M-80 230 C150 180 360 255 610 215 C850 176 1035 235 1280 190" fill="none" stroke="#A18463" stroke-opacity=".14" stroke-width="1.3">
      <animateTransform attributeName="transform" type="translate" values="18 0;-20 4;18 0" dur="14s" repeatCount="indefinite"/>
    </path>

    <rect x="30" y="28" width="1140" height="204" rx="25" fill="#FFFFFF" fill-opacity=".045" stroke="#E8E3D8" stroke-opacity=".16"/>
    <rect x="31" y="29" width="1138" height="1" rx="1" fill="#FFFFFF" fill-opacity=".18"/>

    <rect x="61" y="61" width="5" height="133" rx="3" fill="url(#accent)"/>

    <text x="91" y="100" fill="#F4F1E8" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="5">AMGED</text>
    <text x="92" y="139" fill="#E8E3D8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">Building practical open-source software</text>
    <text x="92" y="173" fill="#D8E2D0" font-family="Arial, Helvetica, sans-serif" font-size="19">Wildlife • Conservation • Better Data • Cloud &amp; DevOps</text>

    <g transform="translate(823 77)">
      <rect width="293" height="103" rx="20" fill="#0D1510" fill-opacity=".26" stroke="#E8E3D8" stroke-opacity=".12"/>
      <circle cx="39" cy="34" r="5" fill="#93AC80"/>
      <circle cx="70" cy="58" r="5" fill="#A18463"/>
      <circle cx="104" cy="29" r="5" fill="#D8E2D0"/>
      <circle cx="139" cy="63" r="5" fill="#6F875F"/>
      <path d="M39 34 L70 58 L104 29 L139 63" fill="none" stroke="#D8E2D0" stroke-opacity=".42" stroke-width="2"/>
      <text x="168" y="38" fill="#F4F1E8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1">BUILD • TEST</text>
      <text x="168" y="61" fill="#C8D3BD" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1">LEARN • ITERATE</text>
      <text x="24" y="88" fill="#D8E2D0" font-family="Arial, Helvetica, sans-serif" font-size="12" opacity=".82">privacy-minded • local-first • open source</text>
    </g>

    <rect x="-420" y="-90" width="250" height="430" fill="url(#shine)" transform="rotate(18 0 0)" opacity=".62">
      <animate attributeName="x" values="-420;1420" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
