name: Generate contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-garden.svg?color_snake=#58704F&color_dots=#F4F1E8,#DDBF98,#B47C52,#7F8C5B,#4F6A45
            dist/github-contribution-garden-dark.svg?palette=github-dark&color_snake=#6F875F&color_dots=#161B22,#4C3024,#80543A,#5C704B,#839B71

      - name: Add earthy snake gradient and randomized edible garden rounds
        shell: python
        run: |
          from datetime import datetime, timezone
          from pathlib import Path
          import os
          import random
          import re

          files = {
              "dist/github-contribution-garden.svg": {
                  "snake": ["#A8BB96", "#7F966B", "#58704F", "#3F5B3B"],
                  "garden_green": ["#D6DEC8", "#A8BB96", "#7F966B", "#58704F"],
                  "garden_brown": ["#E0C29A", "#C48A5A", "#9A613B", "#6E402A"],
              },
              "dist/github-contribution-garden-dark.svg": {
                  "snake": ["#A8B89A", "#7F986F", "#58704F", "#32442F"],
                  "garden_green": ["#354731", "#4E6446", "#6D875E", "#8AA078"],
                  "garden_brown": ["#4C3024", "#704832", "#98623F", "#C08A5A"],
              },
          }

          blank_cell = re.compile(r'<rect class="c"(?P<rest>[^>]*)/>')
          snake_head = re.compile(
              r'@keyframes s0\{(?P<body>.*?)\}\.s\.s0',
              re.DOTALL,
          )
          movement = re.compile(
              r'(?P<times>[^{}]+)\{transform:translate\('
              r'(?P<x>-?\d+(?:\.\d+)?)px,'
              r'(?P<y>-?\d+(?:\.\d+)?)px\)\}'
          )
          cell_duration = re.compile(
              r'\.c\{[^}]*animation:none\s+(?P<ms>\d+)ms',
              re.DOTALL,
          )

          def snake_route_times(svg):
              match = snake_head.search(svg)
              if not match:
                  raise RuntimeError("Could not find the generated snake-head animation")

              points = []
              for step in movement.finditer(match.group("body")):
                  x = float(step.group("x"))
                  y = float(step.group("y"))
                  for value in re.findall(r'(\d+(?:\.\d+)?)%', step.group("times")):
                      points.append((float(value), x, y))

              points.sort(key=lambda point: point[0])
              route = {}

              for (start_t, start_x, start_y), (end_t, end_x, end_y) in zip(points, points[1:]):
                  dx = end_x - start_x
                  dy = end_y - start_y

                  if dx and dy:
                      continue

                  distance = max(abs(dx), abs(dy))
                  steps = round(distance / 16)
                  if steps <= 0 or abs(distance - steps * 16) > 0.01:
                      continue

                  for index in range(1, steps + 1):
                      fraction = index / steps
                      x = round(start_x + dx * fraction)
                      y = round(start_y + dy * fraction)
                      when = start_t + (end_t - start_t) * fraction

                      if x < 0 or y < 0:
                          continue

                      route.setdefault((x, y), when)

              return route

          def blank_route_cells(svg, route_times):
              cells = []
              for match in blank_cell.finditer(svg):
                  rest = match.group("rest")
                  x_match = re.search(r'\bx="(\d+)"', rest)
                  y_match = re.search(r'\by="(\d+)"', rest)
                  if not x_match or not y_match:
                      continue

                  cell = (int(x_match.group(1)) - 2, int(y_match.group(1)) - 2)
                  eat_at = route_times.get(cell)
                  if eat_at is not None and 8.0 <= eat_at <= 88.0:
                      cells.append(cell)
              return cells

          def select_round(candidates, rng, limit=18):
              pool = candidates[:]
              rng.shuffle(pool)
              selected = []

              def too_close(cell):
                  x, y = cell
                  return any(
                      abs(x - sx) <= 16 and abs(y - sy) <= 16
                      for sx, sy in selected
                  )

              for cell in pool:
                  if len(selected) >= limit:
                      break
                  if too_close(cell):
                      continue
                  selected.append(cell)

              return selected

          def build_keyframes(class_name, schedule, rounds, total_ms):
              span = 100.0 / rounds
              epsilon = min(0.012, span / 300.0)
              selected_by_round = {
                  round_index: (eat_at, color)
                  for round_index, eat_at, color in schedule
              }
              events = {}

              for round_index in range(rounds):
                  start = round_index * span
                  end = (round_index + 1) * span
                  events[start] = "var(--ce)"
                  events[max(start, end - epsilon)] = "var(--ce)"
                  events[end] = "var(--ce)"

                  selected = selected_by_round.get(round_index)
                  if selected is None:
                      continue

                  eat_at, color = selected
                  eat = start + (eat_at / 100.0) * span
                  eat = max(start + epsilon, min(end - 2 * epsilon, eat))

                  events[start] = color
                  events[eat] = color
                  events[min(end - epsilon, eat + epsilon)] = "var(--ce)"

              events[100.0] = "var(--ce)"
              frames = "".join(
                  f"{pct:.4f}%{{fill:{value}}}"
                  for pct, value in sorted(events.items())
              )
              return (
                  f"@keyframes {class_name}{{{frames}}}"
                  f".c.{class_name}{{fill:var(--ce);animation-name:{class_name};"
                  f"animation-duration:{total_ms}ms;animation-timing-function:steps(1,end);"
                  f"animation-iteration-count:infinite}}"
              )

          round_count = 12
          run_seed = (
              os.environ.get("GITHUB_RUN_ID")
              or datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S")
          )
          run_attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "1")

          for filename, palette in files.items():
              path = Path(filename)
              svg = path.read_text(encoding="utf-8")
              route_times = snake_route_times(svg)
              candidates = blank_route_cells(svg, route_times)

              duration_match = cell_duration.search(svg)
              if not duration_match:
                  raise RuntimeError("Could not determine the generated snake duration")
              base_ms = int(duration_match.group("ms"))
              total_ms = base_ms * round_count

              snake_overrides = "".join(
                  f".s.s{i}{{fill:{color}}}"
                  for i, color in enumerate(palette["snake"])
              )

              schedules = {}
              shared_seed_name = Path(filename).name.replace("-dark", "")

              for round_index in range(round_count):
                  rng = random.Random(
                      f"{run_seed}:{run_attempt}:{shared_seed_name}:round:{round_index}"
                  )
                  selected = select_round(candidates, rng, limit=18)

                  brown_count = len(selected) // 2
                  families = ["brown"] * brown_count
                  families += ["green"] * (len(selected) - brown_count)
                  rng.shuffle(families)

                  shade_weights = [0.20, 0.38, 0.30, 0.12]
                  for cell, family in zip(selected, families):
                      colors = palette[f"garden_{family}"]
                      color = rng.choices(colors, weights=shade_weights, k=1)[0]
                      schedules.setdefault(cell, []).append(
                          (round_index, route_times[cell], color)
                      )

              class_by_cell = {}
              garden_css = []

              for index, cell in enumerate(sorted(schedules)):
                  class_name = f"g{index}"
                  class_by_cell[cell] = class_name
                  garden_css.append(
                      build_keyframes(
                          class_name,
                          schedules[cell],
                          round_count,
                          total_ms,
                      )
                  )

              def decorate(match):
                  rest = match.group("rest")
                  x_match = re.search(r'\bx="(\d+)"', rest)
                  y_match = re.search(r'\by="(\d+)"', rest)
                  if not x_match or not y_match:
                      return match.group(0)

                  cell = (int(x_match.group(1)) - 2, int(y_match.group(1)) - 2)
                  class_name = class_by_cell.get(cell)
                  if not class_name:
                      return match.group(0)

                  return f'<rect class="c {class_name}"{rest}/>'

              svg = blank_cell.sub(decorate, svg)

              # snk compresses eaten contribution runs into long .u rectangles.
              # GitHub can render those as a lopsided horizontal color bar, so
              # keep the real contribution cells and snake but hide that helper layer.
              helper_layer_fix = ".u{opacity:0!important}"

              svg = svg.replace(
                  "</style>",
                  helper_layer_fix + snake_overrides + "".join(garden_css) + "</style>",
                  1,
              )
              path.write_text(svg, encoding="utf-8")

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd # v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
